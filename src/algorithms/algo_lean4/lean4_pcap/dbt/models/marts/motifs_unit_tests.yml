unit_tests:
  # Shared fixture discipline: the h1 case is literally the Lean example
  # `HasReturnTrip ["A", "B", "A"]` in EnclaveFlows/Motifs.lean, and h3 is the
  # "gaps create no false motifs" acceptance criterion from goal.md.
  - name: return_motif_from_known_sequences
    description: >
      A->B->A within the gap bounds yields exactly one return motif; A->B->C
      yields none; an A->B...(huge gap)...A return across a session break
      yields none.
    model: mart_motif_return
    given:
      - input: ref('feat_flows')
        rows:
          - {flow_id: 1, sa: "h1", da: "A", time_start: 0.0, service_class: "http"}
          - {flow_id: 2, sa: "h1", da: "B", time_start: 10.0, service_class: "http"}
          - {flow_id: 3, sa: "h1", da: "A", time_start: 20.0, service_class: "http"}
          - {flow_id: 4, sa: "h2", da: "A", time_start: 0.0, service_class: "http"}
          - {flow_id: 5, sa: "h2", da: "B", time_start: 10.0, service_class: "http"}
          - {flow_id: 6, sa: "h2", da: "C", time_start: 20.0, service_class: "http"}
          - {flow_id: 7, sa: "h3", da: "A", time_start: 0.0, service_class: "http"}
          - {flow_id: 8, sa: "h3", da: "B", time_start: 10.0, service_class: "http"}
          - {flow_id: 9, sa: "h3", da: "A", time_start: 100000.0, service_class: "http"}
    expect:
      rows:
        - {sa: "h1", dst_a: "A", dst_b: "B", n_occurrences: 1}
