---
version: 2

models:
  - name: stg_points
    description: Canonical GPS points (one per kept user/trajectory/timestamp)
    columns:
      - name: obs_id
        tests: [unique, not_null]
      - name: obs_key
        tests: [not_null]
      - name: user_id
        tests: [not_null]
      - name: trajectory_id
        tests: [not_null]
      - name: ts_s
        tests: [not_null]
      - name: latitude
        tests: [not_null]
      - name: longitude
        tests: [not_null]
      - name: mode_class
        tests:
          - not_null
          - accepted_values:
              values: ['walk', 'bike', 'bus', 'car', 'rail', 'other', 'XX']

  - name: feat_steps
    columns:
      - name: obs_id
        tests: [unique, not_null]
      - name: dt_s
        tests: [not_null]
      - name: speed_class
        tests:
          - not_null
          - accepted_values:
              values: ['spd_still', 'spd_walk', 'spd_city', 'spd_fast', 'spd_vfast']
      - name: turn_bin
        tests:
          - accepted_values:
              values: ['tb_0', 'tb_1', 'tb_2', 'tb_3', 'tb_4', 'tb_5', 'tb_6', 'tb_7']
              config:
                where: "turn_bin is not null"
      - name: hour_bin
        tests:
          - not_null
          - accepted_values:
              values: ['dep_night', 'dep_morning', 'dep_afternoon', 'dep_evening']

  - name: feat_legs
    columns:
      - name: leg_id
        tests: [unique, not_null]
      - name: mode_class
        tests: [not_null]
      - name: dist_class
        tests:
          - not_null
          - accepted_values:
              values: ['dist_lt1k', 'dist_1_3k', 'dist_3_10k', 'dist_ge10k']

  - name: feat_staypoints
    columns:
      - name: user_id
        tests: [not_null]
      - name: origin
        tests:
          - not_null
          - accepted_values:
              values: ['sp', 'implied']
      - name: dwell_s
        tests: [not_null]
      - name: resid_sd_m
        tests:
          - not_null:
              config:
                where: "origin = 'sp'"

  - name: feat_anchors
    columns:
      - name: user_id
        tests: [not_null]
      - name: role
        tests:
          - not_null
          - accepted_values:
              values: ['home', 'work', 'other']

  - name: feat_visits
    columns:
      - name: user_id
        tests: [not_null]
      - name: role
        tests:
          - not_null
          - accepted_values:
              values: ['home', 'work', 'other']
      - name: dwell_class
        tests:
          - not_null
          - accepted_values:
              values: ['dw_lt1h', 'dw_1_3h', 'dw_3_8h', 'dw_8_14h', 'dw_ge14h']
      - name: arr_bin
        tests:
          - not_null
          - accepted_values:
              values: ['dep_night', 'dep_morning', 'dep_afternoon', 'dep_evening']
      - name: dep_bin
        tests:
          - not_null
          - accepted_values:
              values: ['dep_night', 'dep_morning', 'dep_afternoon', 'dep_evening']
      - name: dist_class
        tests:
          - accepted_values:
              values: ['dist_lt1k', 'dist_1_3k', 'dist_3_10k', 'dist_ge10k']
              config:
                where: "dist_class is not null"
      - name: trans_cell
        tests:
          - accepted_values:
              values: ['home__home', 'home__work', 'home__other',
                       'work__home', 'work__work', 'work__other',
                       'other__home', 'other__work', 'other__other']
              config:
                where: "trans_cell is not null"

  - name: feat_user_days
    columns:
      - name: user_id
        tests: [not_null]
      - name: day_idx
        tests: [not_null]
      - name: motif_class
        tests:
          - not_null
          - accepted_values:
              values: ['home_day', 'commute', 'errand_loop', 'tour', 'irregular']
      - name: spd_bin
        tests:
          - not_null
          - accepted_values:
              values: ['spd_1', 'spd_2', 'spd_3', 'spd_4_5', 'spd_6p']

  - name: feat_route_segments
    columns:
      - name: seg_class
        tests:
          - not_null
          - accepted_values:
              values: ['seg_lt50', 'seg_50_150', 'seg_150_600', 'seg_ge600']
      - name: ja_class
        tests:
          - not_null
          - accepted_values:
              values: ['ja_30_60', 'ja_60_120', 'ja_120_180']

  - name: feat_route_legs
    columns:
      - name: leg_id
        tests: [unique, not_null]
      - name: circ_class
        tests:
          - accepted_values:
              values: ['circ_lt120', 'circ_120_150', 'circ_150_250', 'circ_ge250']
              config:
                where: "circ_class is not null"

  - name: mart_seg_hist
    columns:
      - name: seg_class
        tests:
          - unique
          - not_null
          - accepted_values:
              values: ['seg_lt50', 'seg_50_150', 'seg_150_600', 'seg_ge600']

  - name: mart_junction_hist
    columns:
      - name: ja_class
        tests:
          - unique
          - not_null
          - accepted_values:
              values: ['ja_30_60', 'ja_60_120', 'ja_120_180']

  - name: mart_dp_motif
    columns:
      - name: cell
        tests:
          - unique
          - not_null
          - accepted_values:
              values: ['home_day', 'commute', 'errand_loop', 'tour', 'irregular']
      - name: clipped_count
        tests: [not_null]
      - name: n_contributing_users
        tests: [not_null]
      - name: clip
        tests: [not_null]

  - name: mart_dp_spd
    columns:
      - name: cell
        tests:
          - unique
          - not_null
          - accepted_values:
              values: ['spd_1', 'spd_2', 'spd_3', 'spd_4_5', 'spd_6p']
      - name: clipped_count
        tests: [not_null]
      - name: n_contributing_users
        tests: [not_null]
      - name: clip
        tests: [not_null]

  - name: mart_dp_transitions
    columns:
      - name: cell
        tests:
          - unique
          - not_null
          - accepted_values:
              values: ['home__home', 'home__work', 'home__other',
                       'work__home', 'work__work', 'work__other',
                       'other__home', 'other__work', 'other__other']
      - name: clipped_count
        tests: [not_null]
      - name: n_contributing_users
        tests: [not_null]
      - name: clip
        tests: [not_null]

  - name: mart_dp_dwell
    columns:
      - name: cell
        tests:
          - unique
          - not_null
          - accepted_values:
              values: ['dw_lt1h', 'dw_1_3h', 'dw_3_8h', 'dw_8_14h', 'dw_ge14h']
      - name: clipped_count
        tests: [not_null]
      - name: n_contributing_users
        tests: [not_null]
      - name: clip
        tests: [not_null]

  - name: mart_dp_departure
    columns:
      - name: cell
        tests:
          - unique
          - not_null
          - accepted_values:
              values: ['dep_night', 'dep_morning', 'dep_afternoon', 'dep_evening']
      - name: clipped_count
        tests: [not_null]
      - name: n_contributing_users
        tests: [not_null]
      - name: clip
        tests: [not_null]

  - name: mart_dp_mode
    columns:
      - name: cell
        tests:
          - unique
          - not_null
          - accepted_values:
              values: ['walk', 'bike', 'bus', 'car', 'rail', 'other']
      - name: clipped_count
        tests: [not_null]
      - name: n_contributing_users
        tests: [not_null]
      - name: clip
        tests: [not_null]

  - name: mart_dp_distance
    columns:
      - name: cell
        tests:
          - unique
          - not_null
          - accepted_values:
              values: ['dist_lt1k', 'dist_1_3k', 'dist_3_10k', 'dist_ge10k']
      - name: clipped_count
        tests: [not_null]
      - name: n_contributing_users
        tests: [not_null]
      - name: clip
        tests: [not_null]

  - name: mart_turn_hist
    columns:
      - name: turn_bin
        tests:
          - unique
          - not_null
          - accepted_values:
              values: ['tb_0', 'tb_1', 'tb_2', 'tb_3', 'tb_4', 'tb_5', 'tb_6', 'tb_7']
