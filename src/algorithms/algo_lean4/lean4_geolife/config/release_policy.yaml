# Release policy v2 — default DENY. Only artifacts listed (and enabled) here
# may leave the enclave.
#
# Two kinds of exportable artifact:
#   dp_releases  per-USER pure ε-DP count histograms produced by the Lean
#                executables (EnclaveGeo DP release on SampCert's discrete
#                Laplace; mechanism theorem proved, composed bound enforced
#                by `lake exe release`). Every cell grid is PUBLIC and fixed
#                (daily-motif classes, the home/work/other role-transition
#                matrix, dwell classes, departure bins, mode classes) so
#                none depends on the data.
#   artifacts    aggregates with suppression thresholds only. Suppression
#                reduces but does NOT eliminate disclosure risk; these carry
#                no formal guarantee.
policy_version: "release-3.0.0-geolife"
require_attestation: true          # export refused without verified attestation
allow_dev_platform_env: GEO_ALLOW_DEV_RELEASE   # 1 = export from a non-enclave dev host (marked attested: false)
# Total ε across all DP releases of one export (pure DP composes additively).
# Exact fraction string; release.py compares with fractions.Fraction, never floats.
#
# release-3.0.0 (2026-11-03, owner decision: "improve synth data fidelity
# even if privacy bounds are worse off"): at n = 64 users the SNR of a cell
# is ~ share × n × ε_cell, independent of the clip. Under release-2.0.0
# (ε_cell 0.05–0.30, total 4) the discrete-Laplace scale clip/ε_cell was
# 33–200 against ~640 clipped user-mass per histogram: departure and mode
# came out mostly noise (a release with morning = 0 departures) and the
# synthetic data reproduced the noise. Now ε_cell = 1 everywhere: the noise
# scale equals ONE user's clip (10), i.e. sd ≈ 14 per cell.
# Ledger: (5 + 9 + 5 + 4 + 6) cells × 1/1 = 29/1 per export. This is a
# WEAK formal guarantee (ε = 29 per user), chosen deliberately for fidelity.
dp_total_epsilon_max: "29/1"
# LIFETIME cap per source dataset (sha256 of the source TSV), across ALL
# exports: pure DP composes over releases of the same users, so re-releasing
# (e.g. after a pipeline fix) spends budget again. release.py keeps an
# append-only ledger in config/epsilon_ledger.jsonl (outside every `make
# clean` target; reconciled against release/*/manifest.json so an export can
# never go unrecorded) and refuses an export that would push the dataset past
# this cap. Raising it is an explicit, reviewed privacy decision. An export
# that provably never left the enclave can be voided, with a reason, via
# `python3 python/release.py --void <export_id> --reason "..."` (audited).
# 33/1 = the 2026-11-02 export (release-2.0.0, ε 4) + ONE release-3.0.0
# export (ε 29); raised by the owner 2026-11-03. Any further re-release of
# this dataset needs another deliberate raise.
dp_lifetime_epsilon_max: "33/1"
dp_releases:
  dp_motif:                        # user-days per daily-motif class (PUBLIC
    clip_l1_per_user: 10           # 5-class grid); per-user contribution =
    epsilon_per_cell: "1/1"        # proportional L1 allocation of the clip
    n_cells: 5                     # total, done in dbt. 5 * 1 = 5
    grid: [home_day, commute, errand_loop, tour, irregular]
    input_relation: mart_dp_motif
    sources:
      - lean/out/dp_release.json
      - lean/out/samples.json
  dp_transitions:                  # anchor-role transitions over the PUBLIC
    clip_l1_per_user: 10           # home/work/other x home/work/other grid,
    epsilon_per_cell: "1/1"        # row-major. 9 * 1 = 9
    n_cells: 9
    grid: [home__home, home__work, home__other,
           work__home, work__work, work__other,
           other__home, other__work, other__other]
    input_relation: mart_dp_transitions
    sources:
      - lean/out/dp_release.json   # histogram "dp_transitions"
  dp_dwell:                        # visit dwell times over the public 5-class
    clip_l1_per_user: 10           # grid. 5 * 1 = 5
    epsilon_per_cell: "1/1"
    n_cells: 5
    grid: [dw_lt1h, dw_1_3h, dw_3_8h, dw_8_14h, dw_ge14h]
    input_relation: mart_dp_dwell
    sources:
      - lean/out/dp_release.json   # histogram "dp_dwell"
  dp_departure:                    # departure times over the public 4-bin
    clip_l1_per_user: 10           # day-part grid. 4 * 1 = 4
    epsilon_per_cell: "1/1"
    n_cells: 4
    grid: [dep_night, dep_morning, dep_afternoon, dep_evening]
    input_relation: mart_dp_departure
    sources:
      - lean/out/dp_release.json   # histogram "dp_departure"
  dp_mode:                         # travel-mode mix over the public 6-class
    clip_l1_per_user: 10           # grid. 6 * 1 = 6
    epsilon_per_cell: "1/1"
    n_cells: 6
    grid: [walk, bike, bus, car, rail, other]
    input_relation: mart_dp_mode
    sources:
      - lean/out/dp_release.json   # histogram "dp_mode"
artifacts:
  noise_moments:
    enabled: true                  # GPS-noise moments (sd/MAD/p95/lag-1) so
    relation: mart_noise_moments   # the generator can render jitter;
    columns: [metric, value, n_staypoints, n_users]   # suppression only,
    suppress:                      # no formal guarantee.
      min_users: {column: n_users, value: 5}
      min_staypoints: {column: n_staypoints, value: 50}
  kinematics:
    enabled: true                  # per-mode-class speed/interval/turn
    relation: mart_kinematics      # summaries; suppression only.
    columns: [mode_class, n_legs, n_points, n_users,
              median_speed_mps, p95_speed_mps, median_dt_s,
              median_abs_turn_deg, median_straightness, median_path_m,
              implausible_rate]
    suppress:
      min_users: {column: n_users, value: 5}
      min_points: {column: n_points, value: 500}
  turn_hist:
    enabled: true                  # turn-angle histogram over public 45-degree
    relation: mart_turn_hist       # bins; suppression only.
    columns: [turn_bin, n_points, n_users]
    suppress:
      min_users: {column: n_users, value: 5}
      min_points: {column: n_points, value: 500}
  dist_mix:
    enabled: true                  # trip-distance class mix; suppression only.
    relation: mart_dist_mix
    columns: [dist_class, n_trips, n_users]
    suppress:
      min_users: {column: n_users, value: 5}
      min_trips: {column: n_trips, value: 50}
  route_shape:
    enabled: true                  # per-mode-class route-shape summaries
    relation: mart_route_shape     # (circuity, straightness, junction rate,
    columns: [mode_class, n_legs, n_users,            # left share);
              median_circuity, p90_circuity,          # suppression only.
              median_straightness, junctions_per_km, share_left]
    suppress:
      min_users: {column: n_users, value: 5}
      min_legs: {column: n_legs, value: 20}
  seg_hist:
    enabled: true                  # inter-junction segment-length histogram
    relation: mart_seg_hist        # over the public 4-class grid;
    columns: [seg_class, n_segments, n_users]   # suppression only.
    suppress:
      min_users: {column: n_users, value: 5}
      min_segments: {column: n_segments, value: 500}
  junction_hist:
    enabled: true                  # junction turn-angle histogram over the
    relation: mart_junction_hist   # public 3-class grid; suppression only.
    columns: [ja_class, n_junctions, n_users]
    suppress:
      min_users: {column: n_users, value: 5}
      min_junctions: {column: n_junctions, value: 500}
  data_integrity:
    enabled: true                  # pipeline row/stage counters ONLY (no
    relation: q_data_integrity     # per-user values, nothing to threshold).
    columns: [counter, n, stage]
  lean_claims:
    enabled: true
    # Theorem statuses + aggregate agreement counts ONLY. The per-user
    # check rows (motifs/tours/revisits/...) identify users and never leave.
    source: lean/out/lean_results.json
    include: [claims, agreement_counts]
model_weights: deny_unless_reviewed   # registry entries stay release_status: internal_unreviewed
# Never exported (individual / user-level), listed for audit:
denied:
  - stg_points             # raw GPS rows (user ids, coordinates, timestamps, trajectory ids)
  - feat_steps             # per-point features (coordinates, speeds, joinable to users)
  - feat_legs              # per-leg movement features (joinable to users)
  - feat_route_points      # resampled per-point route stream (coordinates, joinable to users)
  - feat_route_segments    # per-segment/junction rows (identifying route geometry)
  - feat_route_legs        # per-leg route-shape rows (joinable to users)
  - feat_staypoints        # staypoint LOCATIONS (lat_c/lon_c) + arrival/departure times
  - feat_anchors           # home/work anchor LOCATIONS — the crown jewels of this dataset
  - feat_visits            # per-visit sequences (anchor roles + locations + times)
  - feat_user_days         # per-user-day structure
  - mart_user_stats        # per-user moments
  - mart_motif_daily       # per-user daily motif labels
  - mart_motif_tours       # per-user tour chains
  - mart_motif_revisit     # per-user anchor revisit windows
  - mart_staypoint_stats   # per-role dwell stats over visit-level rows
  - mart_assoc_cells       # contingency cells over visit/leg-level features
  - mart_seq_*             # exact (unnoised) role/mode transition counts
  - mart_dp_spd            # DP input without ledger budget (not released)
  - mart_dp_distance       # DP input without ledger budget (not released)
  - ml_geo_scores          # per-point/per-user model scores
