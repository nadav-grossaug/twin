  - name: mart_dp_trips
    columns:
      - name: cell
        tests:
          - unique
          - not_null
          - accepted_values:
              values: ['tp_1', 'tp_2', 'tp_3p']
      - name: clipped_count
        tests: [not_null]
      - name: n_contributing_users
        tests: [not_null]
      - name: clip
        tests: [not_null]

  - name: mart_dp_device_persist
    columns:
      - name: cell
        tests:
          - unique
          - not_null
          - accepted_values:
