  - name: mart_dp_return_rate
    columns:
      - name: cell
        tests:
          - unique
          - not_null
          - accepted_values:
              values: ['rr_0_19', 'rr_20_39', 'rr_40_59', 'rr_60_79',
                       'rr_80_100']
      - name: clipped_count
        tests: [not_null]
      - name: n_contributing_users
        tests: [not_null]
      - name: clip
