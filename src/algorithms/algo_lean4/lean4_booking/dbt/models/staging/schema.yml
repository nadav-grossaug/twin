  - name: mart_dp_affiliate
    columns:
      - name: cell
        tests:
          - unique
          - not_null
          - accepted_values:
              values: ['a9924', 'a359', 'a384', 'a9452', 'a4541',
                       'a8436', 'a10332', 'a3631', 'aff_other']
      - name: clipped_count
        tests: [not_null]
      - name: n_contributing_users
        tests: [not_null]
      - name: clip
        tests: [not_null]

  - name: mart_dp_booker
    columns:
      - name: cell
        tests:
          - unique
          - not_null
          - accepted_values:
              values: ['Gondal', 'The Devilfire Empire', 'Elbonia',
