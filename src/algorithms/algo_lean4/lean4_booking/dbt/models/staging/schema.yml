      - name: clipped_count
        tests: [not_null]
      - name: n_contributing_users
        tests: [not_null]
      - name: clip
        tests: [not_null]

  - name: mart_dp_device
    columns:
      - name: cell
        tests:
          - unique
          - not_null
          - accepted_values:
              values: ['desktop', 'mobile', 'tablet']
      - name: clipped_count
        tests: [not_null]
      - name: n_contributing_users
        tests: [not_null]
      - name: clip
