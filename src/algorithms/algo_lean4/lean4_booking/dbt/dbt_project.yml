name: enclave_trip
version: "1.0.0"
config-version: 2
profile: enclave_trip

model-paths: ["models"]
seed-paths: ["seeds"]
target-path: target
clean-targets: ["target", "dbt_packages", "logs"]

vars:
  # ----- the versioned concept spec -----------------------------------------
  # Single source of truth for thresholds, units and conventions.
  # python/spec.py reads this block; lean/EnclaveTrip/Params.lean mirrors the
  # numeric values; tests/test_spec_sync.py checks all three agree.
  # The hotel-country -> tier map is the seed seeds/country_tiers.csv and the
  # affiliate -> tier map is seeds/affiliate_tiers.csv (same sync test).
  # Bump spec_version whenever any value below changes.
  # 1.1.0: rc_13p_draw_hi narrowed 64 -> 24 (uniform-in-bin draws over
  # [13,64] inflated the synthetic records/user mean by ~17%); the
  # synth replicate tolerance var synth_repeat_tol_pct added.
  # 1.2.0 (epsilon REALLOCATION, fidelity over privacy per the owner):
  # the month-of-year release is REPLACED by a 15-cell month-of-window
  # release (mart_dp_month_window; the real calendar is a censoring ramp
  # that month-of-year flattened, distorting edge months up to 15x); a new
  # 6-cell repeat-structure release (mart_dp_repeat_struct: consecutive
  # stay-extensions vs non-adjacent revisits — real consecutive same-city
  # legs are 9.01% of legs, the old single return hop rendered 1.66%);
  # country_transition epsilon 3/100 -> 4/100 and return_rate 4/100 ->
  # 6/100 where DP noise bit; the dow release is DROPPED (measured
  # uniform, never enforced — the uniform public prior covers it). Ledger:
  # 28+48+1024+30+24+30+15+36+20+30+30 = 1315/100 = 13.15 <= 14/1.
  # 1.3.0 (second fidelity pass — new minimodels/motifs/features): three
  # new releases for structure the marginals hide — trips_per_user (tp_1/
  # tp_2/tp_3p; real 91.1/7.4/1.5%, the single_trip prior rendered 1.00),
  # device_persist (dv_1/dv_2/dv_3: 70.7% of trips are single-device; iid
  # draws would render ~12%), affiliate_persist (ap_1..ap_4p: 75.4% of
  # legs keep the previous leg's tier). Ledger:
  # 1315 + 3*6 + 3*5 + 4*5 = 1368/100 = 13.68 <= 14/1.
  spec_version: "1.3.0"
  # path to the booking reservations CSV, relative to the dbt/ working dir
  booking_csv_path: "{{ env_var('BOOKING_CSV', '../combined_set.csv') }}"
  # public reservation-count bins (per-user total reservations:
  # 1-3, 4, 5, 6, 7-8, 9-12, 13+; lower edges)
  rc_e4: 4
  rc_e5: 5
  rc_e6: 6
  rc_e7: 7
  rc_e9: 9
  rc_e13: 13
  # public stay-night classes (nights per reservation): identity bins
  # n_1..n_3 below nights_e4, then n_4_6 below nights_e7, else n_7p
  nights_e4: 4
  nights_e7: 7
  # public inter-leg gap classes (days between a leg's checkout and the next
  # leg's checkin): g_0 (contiguous), g_1 below gap_e2, g_2_3 below
  # gap_e4, else g_4p
  gap_e2: 2
  gap_e4: 4
  # public caps (generator range ceilings; mirror Params.lean gapMax /
  # nightsMax / rcMax)
  gap_max_d: 33             # measured max inter-leg gap
  nights_max: 30            # measured max stay nights
  rc_max: 64               # rc_13p bin ceiling (measured max 48)
  rc_13p_draw_hi: 24       # rc_13p DRAW range upper edge (~p99 of the
                           # measured per-user reservation counts; uniform
                           # draws over [13,64] overshot the real within-bin
                           # mean ~17-20 by ~20 nights) — spec 1.1.0
  synth_repeat_tol_pct: 15  # per-category share tolerance for synth
                           # replicate checks (scripts/synth.py replicates)
  # 1.3.0 public priors for the multi-trip rendering
  tp_draw_hi: 6            # tp_3p draw range [3, tp_draw_hi] (measured
                           # max trips/user 27; p99 ~ 6)
  intertrip_gap_max_d: 94  # inter-trip gap: uniform [1, 94] declared
                           # prior (measured median 47 days, IQR 4-117)
  # motif thresholds (public constants, picked from measured distributions)
  tour_min_countries: 3      # a tour spans >= 3 distinct hotel countries ...
  tour_min_legs: 4           # ... over >= 4 legs ...
  tour_max_gap_d: 7          # ... with every inter-leg gap <= 7 days
  corridor_min_repeats: 3   # same ordered country pair >= 3 times by one user
  corridor_cv_max_num: 4     # ... with gap CV <= 4/5 (beacon analog)
  corridor_cv_max_den: 5
  longstay_min_nights: 7     # stay >= 7 nights = long stay
  longstay_near_miss_nights: 5  # near-miss floor kept for the Lean check
  seqbreak_gap_d: 14         # gaps > 14d break trip-sequence continuity logic
  # per-user return-rate bands (uniform width, percent): share of a user's
  # trips that revisit an earlier city of the same trip
  rr_band_width_pct: 20
  # common-knowledge suppression floors (suppression only; no formal guarantee)
  topk_city_min_users: 50
  topk_city_min_res: 100
  topk_trans_min_users: 50
  topk_trans_min_trans: 100
  gap_moment_min_gaps: 200
  # DP release parameters (public)
  dp_clip_total: 8           # per-user L1 budget per histogram, allocated
                             # across the user's cells proportionally
                             # (largest-remainder); ~p95 of legs/user
  dp_count_clip: 1           # one-cell-per-user histograms: each user falls
                             # in exactly one cell
  # public observation window (epoch days; end exclusive)
  window_start_day: 16770    # 2015-12-01
  window_end_day: 17226      # 2017-03-01

models:
  enclave_trip:
    staging:
      +materialized: table
    features:
      +materialized: table
    marts:
      +materialized: table
    ml:
      +materialized: table

seeds:
  enclave_trip:
    country_tiers:
      +column_types:
        country: varchar
        tier: varchar
    affiliate_tiers:
      +column_types:
        affiliate_id: bigint
        aff_tier: varchar
